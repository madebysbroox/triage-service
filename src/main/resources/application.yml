server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

spring:
  application:
    name: triage-service

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics

triage:
  provider: ${TRIAGE_PROVIDER:mock}
  api-key: ${TRIAGE_API_KEY:local-dev-key}
  max-body-bytes: ${TRIAGE_MAX_BODY_BYTES:1048576}
  log-slicing:
    max-lines: ${TRIAGE_LOG_MAX_LINES:120}
    context-before: ${TRIAGE_LOG_CONTEXT_BEFORE:3}
    context-after: ${TRIAGE_LOG_CONTEXT_AFTER:6}
  gating:
    min-confidence: ${TRIAGE_MIN_CONFIDENCE:0.75}
    force-review-severities: ${TRIAGE_FORCE_REVIEW_SEVERITIES:HIGH,CRITICAL}
  model:
    id: ${TRIAGE_MODEL_ID:mock-deterministic-v1}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    model: ${TRIAGE_ANTHROPIC_MODEL:claude-opus-5-5}
    max-tokens: ${TRIAGE_ANTHROPIC_MAX_TOKENS:4096}
    effort: ${TRIAGE_ANTHROPIC_EFFORT:low}
    fallbacks: ${TRIAGE_ANTHROPIC_FALLBACKS:true}
    input-usd-per-mtok: ${TRIAGE_ANTHROPIC_INPUT_USD_PER_MTOK:4.00}
    output-usd-per-mtok: ${TRIAGE_ANTHROPIC_OUTPUT_USD_PER_MTOK:20.00}
